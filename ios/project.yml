name: NOR
options:
  bundleIdPrefix: app.nor.private
  deploymentTarget:
    iOS: '17.0'
schemes:
  NOR:
    build:
      targets:
        NOR: all
    test:
      targets: [NORTests]
targets:
  NOR:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nor.private.iphone
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 4
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NOR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: NOR utilise le microphone quand vous activez la dictée ou la conversation vocale automatique.
        NSSpeechRecognitionUsageDescription: NOR transcrit votre question sur cet iPhone, si la reconnaissance locale est disponible.
  NORTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: NOR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
